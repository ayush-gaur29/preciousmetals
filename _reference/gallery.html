<!DOCTYPE html>
<html lang="en" id="top">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gallery — Precious Metals Consulting LLC</title>
<meta name="description" content="Explore our portfolio of diamond exploration, gold extraction, and infrastructure projects across Angola." />
<meta name="theme-color" content="#0B0D12" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tw.js"></script>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<main id="content">

  <!-- HERO -->
  <section class="page-hero pt-[76px]">
    <div class="absolute -z-10 top-[-30%] right-[-10%] w-[650px] h-[650px] rounded-full blur-[90px]" style="background:radial-gradient(circle,rgba(0,123,167,.5),transparent 65%)"></div>
    <div class="absolute -z-10 bottom-[-40%] left-[10%] w-[450px] h-[450px] rounded-full blur-[90px]" style="background:radial-gradient(circle,rgba(255,77,141,.2),transparent 65%)"></div>
    <div class="grid-lines"></div>
    <div class="container-x py-20 sm:py-28 grid lg:grid-cols-12 gap-10 items-end">
      <div class="lg:col-span-8">
        <nav class="text-sm text-silver flex items-center gap-2 reveal" aria-label="Breadcrumb">
          <a href="index.html" class="hover:text-white transition-colors">Home</a>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
          <span class="text-white">Gallery</span>
        </nav>
        <h1 class="mt-6 font-display font-semibold text-5xl sm:text-7xl lg:text-8xl leading-[.98] reveal" style="--d:.06s">
          Our <span class="text-gradient">Gallery</span>
        </h1>
      </div>
      <p class="lg:col-span-4 text-silver-300 text-lg reveal" style="--d:.12s">
        Witness our ground operations, mining ventures, refined mineral resources, and premium infrastructure developments throughout Angola.
      </p>
    </div>

    <!-- Category Filters -->
    <div class="border-t border-white/10">
      <div class="container-x py-4 flex gap-3 overflow-x-auto no-scrollbar" id="filters" style="scrollbar-width:none">
        <button class="ftab active" data-filter="all">All Visuals</button>
        <button class="ftab" data-filter="mining">Diamond &amp; Mining</button>
        <button class="ftab" data-filter="operations">Operations &amp; Prospection</button>
        <button class="ftab" data-filter="infrastructure">Real Estate &amp; Infra</button>
      </div>
    </div>
  </section>

  <!-- GALLERY GRID -->
  <section class="bg-soft py-20 sm:py-28">
    <div class="container-x">
      <div id="gallery-container" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>
  </section>

  <!-- CTA -->
  <div id="cta"></div>
</main>

<script type="module">
  import { boot } from './js/main.js';
  import { GALLERY } from './js/data.js';
  import { ctaBand } from './js/layout.js';

  const ITEMS = [
    { src: 'assets/hero.png', title: 'Precious Metals & Uncut Rough Diamonds', cat: 'mining', desc: 'Sustainably sourced rough stones and polished precious metals ready for global marketing.' },
    { src: 'assets/diamond.png', title: 'Natural Gemstone Extractions', cat: 'mining', desc: 'High-purity raw diamonds from prime Angolan mineral concessions.' },
    { src: 'assets/landscape.png', title: 'Angola Mineral Concession Aerial Survey', cat: 'operations', desc: 'Geological mapping and terrain analysis for mining expansion.' },
    { src: GALLERY[0], title: 'Heavy Equipment & Extraction Site', cat: 'operations', desc: 'Modern alluvial mining machinery operating with precision and regulatory compliance.' },
    { src: GALLERY[9], title: 'On-Site Evaluation & Mineral Sampling', cat: 'operations', desc: 'Technical team conducting density and carats grading protocols in the field.' },
    { src: GALLERY[1], title: 'High-Purity Rough Diamond Batch', cat: 'mining', desc: 'Kimberlite & alluvial diamond lot ready for certification and export.' },
    { src: GALLERY[2], title: 'Industrial Sorting & Quality Verification', cat: 'mining', desc: 'State-of-the-art optical sorters evaluating diamond transparency and clarity.' },
    { src: GALLERY[3], title: 'Gold Prospecting & Washing Operations', cat: 'operations', desc: 'High-efficiency recovery operations adhering to environmental best practices.' },
    { src: GALLERY[10], title: 'Prime Urban Commercial Development', cat: 'infrastructure', desc: 'Strategic real estate assets providing high-yield returns in growing economic corridors.' },
    { src: GALLERY[11], title: 'Modern Industrial & Logistics Center', cat: 'infrastructure', desc: 'Supporting international supply chains and energy distribution networks.' },
    { src: GALLERY[4], title: 'Refinery & Stone Preparation Facilities', cat: 'operations', desc: 'End-to-end processing pipeline ensuring maximum yield and stone integrity.' },
    { src: GALLERY[5], title: 'Executive Resort & Hospitality Development', cat: 'infrastructure', desc: 'Luxury hospitality ventures catering to international investors and high-end tourism.' }
  ];

  boot('gallery', () => {
    const container = document.getElementById('gallery-container');
    const filterBtns = document.querySelectorAll('#filters [data-filter]');

    function render(filter = 'all') {
      const filtered = filter === 'all' ? ITEMS : ITEMS.filter(x => x.cat === filter);
      container.innerHTML = filtered.map((item, i) => `
        <article class="g-item group reveal rounded-3xl bg-white border border-silver-200 overflow-hidden shadow-sm hover:shadow-xl transition-all duration-500" style="--d:${(i % 3) * .05}s">
          <a href="${item.src}" data-lb="${item.src}" class="tile block aspect-[4/3] bg-jet/5 relative overflow-hidden" aria-label="Enlarge image ${item.title}">
            <img src="${item.src}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" loading="lazy" />
            <div class="absolute inset-0 bg-jet/0 group-hover:bg-jet/35 transition-colors duration-300 flex items-center justify-center">
              <span class="w-12 h-12 rounded-full bg-white/95 text-jet grid place-items-center opacity-0 scale-75 group-hover:opacity-100 group-hover:scale-100 transition-all duration-300 shadow-md">
                <i data-lucide="maximize-2" class="w-5 h-5"></i>
              </span>
            </div>
            <span class="absolute top-4 left-4 chip glass-light text-jet text-xs font-semibold uppercase tracking-wider backdrop-blur-md">
              ${item.cat === 'mining' ? 'Diamond & Mining' : (item.cat === 'operations' ? 'Operations' : 'Infrastructure')}
            </span>
          </a>
          <div class="p-6">
            <h3 class="font-display font-semibold text-lg text-jet group-hover:text-cerulean transition-colors">${item.title}</h3>
            <p class="mt-2 text-sm text-silver-600 leading-relaxed">${item.desc}</p>
            <div class="mt-4 pt-4 border-t border-silver-200/60 flex items-center justify-between text-xs font-medium text-cerulean">
              <span class="inline-flex items-center gap-1.5">Precious Metals Consulting LLC</span>
              <span class="text-silver hover:text-cerulean flex items-center gap-1">Click to view <i data-lucide="arrow-up-right" class="w-3.5 h-3.5"></i></span>
            </div>
          </div>
        </article>
      `).join('');

      // Re-trigger icons & reveal
      if (window.lucide) {
        window.lucide.createIcons();
      }
      const newItems = container.querySelectorAll('.reveal');
      const io = new IntersectionObserver(entries => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            e.target.classList.add('in');
            io.unobserve(e.target);
          }
        });
      }, { threshold: 0.1 });
      newItems.forEach(el => io.observe(el));
    }

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render(btn.getAttribute('data-filter'));
      });
    });

    render('all');

    document.getElementById('cta').outerHTML = ctaBand(
      'Partner in Mining &amp; Infrastructure',
      'Schedule a Confidential Briefing Today'
    );
  });
</script>
</body>
</html>
